name: Configurar hitos y etiquetas
on:
  push:
    paths:
      - .github/workflows/configurar-planificacion.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  configurar:
    runs-on: ubuntu-latest
    steps:
      - name: Crear hitos, colorear etiquetas y vincular tareas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          root = f"https://api.github.com/repos/{repo}"

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  root + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          milestones = [
              ("M0", "M0 · Definición funcional", "Alcance, recorridos, reglas de negocio y contratos."),
              ("M1", "M1 · Base de plataforma", "Cuentas, sesiones, permisos, seguridad y estructura multi negocio."),
              ("M2", "M2 · Catálogo e inventario", "Productos, precios, existencias y reservas de stock."),
              ("M3", "M3 · Operación comercial", "Clientes, pedidos, ventas, chat y panel operativo."),
              ("M4", "M4 · Agente Grok", "Herramientas, memoria, aprobaciones y observabilidad del agente."),
              ("M5", "M5 · Proveedores y fiados", "Reposición, órdenes de compra y cuentas por cobrar."),
              ("M6", "M6 · Integraciones", "WhatsApp Business, Wompi y modalidad fiscal."),
              ("M7", "M7 · Piloto y evaluación", "Aislamiento, evaluación y operación del piloto."),
          ]
          existing = {
              item["title"]: item["number"]
              for item in api("GET", "/milestones?state=all&per_page=100")
          }
          numbers = {}
          for key, title, description in milestones:
              if title in existing:
                  numbers[key] = existing[title]
              else:
                  result = api("POST", "/milestones", {
                      "title": title,
                      "description": description,
                      "state": "open",
                  })
                  numbers[key] = result["number"]
              print(f"{key}: milestone #{numbers[key]}")

          colors = {
              "priority:p0": "d73a4a",
              "priority:p1": "fbca04",
              "priority:p2": "0e8a16",
              "type:decision": "5319e7",
              "type:research": "bfd4f2",
              "area:platform": "c2e0c6",
              "area:security": "f9d0c4",
              "area:catalog": "c5def5",
              "area:inventory": "bfdadc",
              "area:sales": "fef2c0",
              "area:chat": "d4c5f9",
              "area:analytics": "d8e8b3",
              "area:agent": "e4c5f9",
              "area:suppliers": "f9d0c4",
              "area:fiado": "fbca04",
              "area:channels": "c5def5",
              "area:payments": "fef2c0",
              "area:fiscal": "ededed",
              "type:feature": "1d76db",
              "type:integration": "0052cc",
              "type:quality": "c2e0c6",
              "stage:foundation": "b60205",
              "stage:operations": "0366d6",
              "stage:integrations": "6f42c1",
              "stage:pilot": "0e8a16",
              "milestone:M0": "ededed",
              "milestone:M1": "d4c5f9",
              "milestone:M2": "bfdadc",
              "milestone:M3": "c5def5",
              "milestone:M4": "f9d0c4",
              "milestone:M5": "fef2c0",
              "milestone:M6": "e99695",
              "milestone:M7": "bfe5bf",
          }
          for label, color in colors.items():
              encoded = urllib.parse.quote(label, safe="")
              try:
                  api("PATCH", f"/labels/{encoded}", {"color": color})
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  api("POST", "/labels", {"name": label, "color": color})
              print(f"Etiqueta {label}")

          ranges = {
              "M0": range(1, 9),
              "M1": range(9, 16),
              "M2": range(16, 23),
              "M3": range(23, 31),
              "M4": range(31, 39),
              "M5": range(39, 45),
              "M6": range(45, 50),
              "M7": range(50, 54),
          }
          for key, issue_numbers in ranges.items():
              for issue_number in issue_numbers:
                  api("PATCH", f"/issues/{issue_number}", {
                      "milestone": numbers[key]
                  })
                  print(f"Issue #{issue_number} → {key}")
          PY
