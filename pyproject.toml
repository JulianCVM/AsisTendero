[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asistendero-semana1"
version = "0.1.0"
description = "Flujo mínimo de AsisTendero con LangGraph y Grok"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "openai>=2.0,<3.0",
    # Fotos: abrir y validar la del cliente, quitarle el EXIF, reducirla y sacar su huella (licencia MIT-CMU).
    "Pillow>=10.1,<13",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
asistendero = "asistendero.entregas.cli:main"
asistendero-visual = "asistendero.entregas.visor.visual:main"
asistendero-tendero = "asistendero.entregas.panel.tendero:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asistendero.entregas" = ["web/*/*.html", "web/*/*.css", "web/*/*.js", "web/*/*.png", "web/*/*.ttf", "web/*/*-OFL.txt"]
"asistendero.datos" = ["fotos/*.jpg", "fotos/fotos.json", "fotos/CREDITOS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
