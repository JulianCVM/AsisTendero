[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asistendero-semana1"
version = "0.1.0"
description = "Flujo mínimo de AsisTendero con LangGraph y Grok"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "openai>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
asistendero = "asistendero.cli:main"
asistendero-visual = "asistendero.visual:main"
asistendero-tendero = "asistendero.tendero:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asistendero = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.png", "ui/*.ttf", "ui/*-OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
